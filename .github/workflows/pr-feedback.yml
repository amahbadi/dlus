# Comments on a pull request with the security results. Runs from the default branch with a token that may comment,
# but never checks out or runs code from the pull request: it only reads the report the Security run left behind.
name: PR security feedback

on:
  workflow_run:
    workflows: [Security]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-report
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const pr = parseInt(fs.readFileSync('report/pr.txt', 'utf8').trim(), 10);
            if (!Number.isInteger(pr) || pr <= 0) throw new Error('no pull request number');
            const { data: p } = await github.rest.pulls.get({ ...context.repo, pull_number: pr });
            if (p.head.sha !== process.env.HEAD_SHA) { core.info('newer commits on the PR - skipping'); return; }
            const results = Object.fromEntries(fs.readFileSync('report/results.txt', 'utf8').trim().split('\n').map(l => l.split('=')));
            const names = { sast: 'Code scan (Bandit + Semgrep)', secrets: 'Secrets (Gitleaks, whole history)', shell: 'Shell scripts + root helper (ShellCheck)' };
            const failed = Object.keys(names).filter(k => results[k] !== 'success');
            const clip = (f, n) => { try { const t = fs.readFileSync('report/' + f, 'utf8').replace(/`/g, "'"); return t.length > n ? t.slice(0, n) + '\n...' : t; } catch { return ''; } };
            let body = '<!-- dlus-security -->\n';
            if (!failed.length) {
              body += '### ✅ Security checks passed\n\nNo findings. This pull request is ready for review by the maintainer.';
            } else {
              body += '### ❌ Security checks found problems\n\nPlease fix these and push again - the checks run by themselves on every push:\n\n';
              for (const k of failed) body += `- **${names[k]}**: ${results[k]}\n`;
              for (const [f, title] of [['bandit.txt', 'Bandit'], ['semgrep.txt', 'Semgrep'], ['shellcheck.txt', 'ShellCheck']]) {
                const t = clip(f, 12000);
                if (t.trim()) body += `\n<details><summary>${title}</summary>\n\n\`\`\`\n${t}\n\`\`\`\n</details>\n`;
              }
              if (failed.includes('secrets')) body += '\nA secret (key, token, password) was found. Remove it from the code **and from the history** of your branch, and revoke it - it is already public.\n';
              body += `\nFull logs: ${process.env.RUN_URL}\n\nThe maintainer reviews the pull request once every check is green.`;
            }
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr, per_page: 100 });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('<!-- dlus-security -->'));
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body });
            const add = failed.length ? 'security: fix needed' : 'ready for review';
            const drop = failed.length ? 'ready for review' : 'security: fix needed';
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr, labels: [add] });
            try { await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr, name: drop }); } catch {}
