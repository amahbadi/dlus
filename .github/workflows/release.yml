name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # rebuild an existing release from its tag (adds signature + provenance to older releases)
    inputs:
      tag:
        description: "release tag to rebuild, e.g. v7.22"
        required: true

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: write # publish the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - name: Only a release tag can be rebuilt
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || { echo "not a release tag: $TAG"; exit 1; }'
        shell: bash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: Checks
        run: |
          python3 -m py_compile dlus.py
          python3 macos/check_names.py dlus.py
          python3 macos/check_js.py dlus.py
          if [ -d tests ]; then python3 -m unittest discover -s tests; fi  # older tags have no tests yet
      - name: Build dlus.app and DMG (universal, ad-hoc signed)
        run: bash macos/build_dmg.sh
      - name: Checksums
        run: cd dist && shasum -a 256 dlus-*.dmg > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance (proves the DMG was built here, from this tag)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dlus-*.dmg
      - name: Signature and provenance files next to the DMG
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for f in dist/dlus-*.dmg; do
            cp "$BUNDLE" "$f.sigstore.json"   # Sigstore bundle: cosign / gh attestation verify --bundle
            python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["dsseEnvelope"], separators=(",", ":")))' "$BUNDLE" > "$f.intoto.jsonl"  # SLSA provenance (DSSE envelope)
          done
          ls -l dist
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          overwrite_files: true
          files: |
            dist/dlus-*.dmg
            dist/dlus-*.dmg.sigstore.json
            dist/dlus-*.dmg.intoto.jsonl
            dist/SHA256SUMS
