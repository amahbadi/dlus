name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    permissions:
      contents: write # publish the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checks
        run: |
          python3 -m py_compile dlus.py
          python3 macos/check_names.py dlus.py
          python3 macos/check_js.py dlus.py
          python3 -m unittest discover -s tests
      - name: Build dlus.app and DMG (universal, ad-hoc signed)
        run: bash macos/build_dmg.sh
      - name: Checksums
        run: cd dist && shasum -a 256 dlus-*.dmg > SHA256SUMS && cat SHA256SUMS
      - name: Build provenance (proves the DMG was built here, from this tag)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dlus-*.dmg
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/dlus-*.dmg
            dist/SHA256SUMS
          generate_release_notes: true
