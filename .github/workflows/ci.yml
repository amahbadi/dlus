name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing scanner fails the step even when piped into tee

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python compiles
        run: python3 -m py_compile dlus.py
      - name: No undefined names
        run: python3 macos/check_names.py dlus.py
      - name: Embedded JavaScript syntax
        run: python3 macos/check_js.py dlus.py
      - name: Shell scripts syntax
        run: for f in gateway/*.sh gateway/dlus-gw macos/*.sh macos/uninstall.command; do bash -n "$f"; done
      - name: ffmpeg (for the media tests)
        run: brew install ffmpeg
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
      - name: Tests with coverage (security, regressions, downloads, servers, media, TV, network)
        run: |
          python3 -m venv /tmp/cov && /tmp/cov/bin/pip install --quiet --require-hashes -r .github/requirements-ci.txt
          /tmp/cov/bin/coverage run --include=dlus.py -m unittest discover -s tests -v
          /tmp/cov/bin/coverage report | tee -a "$GITHUB_STEP_SUMMARY"
          /tmp/cov/bin/coverage json -o coverage.json
      - name: Keep the coverage result for the badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.json
          retention-days: 7
      - name: VPN-router firewall rules load in macOS pf (syntax check, changes nothing)
        run: sudo bash gateway/dlus-gw selftest | tee /dev/stderr | grep -c '^ok rules' | grep -qx 3
      - name: Swift coding style (swift format, see .swift-format)
        run: swift format lint --strict macos/main.swift
      - name: Native app compiles
        run: swiftc -O -target arm64-apple-macos12.0 -o /tmp/dlus macos/main.swift
      - name: Repeatable build (dlus.app identical in two builds)
        run: bash macos/check_repeatable.sh

  badge:
    # publishes the coverage percentage to the "badges" branch, which the README badge reads (shields.io endpoint)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Badge data
        run: |
          python3 - <<'PY'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellowgreen" if pct >= 70 else "yellow" if pct >= 60 else "orange"
          json.dump({"schemaVersion": 1, "label": "coverage", "message": "%d%%" % pct, "color": color}, open("badge.json", "w"))
          print("coverage %.1f%%" % pct)
          PY
      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mkdir pub && cd pub && git init -q -b badges && cp ../badge.json coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" add coverage.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "coverage badge"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
