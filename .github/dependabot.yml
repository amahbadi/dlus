version: 2
updates:
  - package-ecosystem: github-actions # keeps the pinned actions up to date (security fixes)
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip # bandit and atheris (pinned with hashes); their own dependencies move with them; semgrep is a pinned image
    directory: /.github
    schedule:
      interval: weekly
    allow:
      - dependency-name: bandit
      - dependency-name: atheris
      - dependency-name: ruff
      - dependency-name: coverage
