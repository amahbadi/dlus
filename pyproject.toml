# Coding standard for dlus (enforced in CI with ruff). dlus uses only the Python standard library;
# its external programs are listed in the Brewfile.
[tool.ruff]
line-length = 160
target-version = "py39"
extend-exclude = ["old", "dist", "work"]

[tool.ruff.lint]
# PEP 8 (pycodestyle E + W) and pyflakes (F: undefined names, unused imports / variables)
select = ["E", "W", "F"]

[tool.ruff.lint.per-file-ignores]
# dlus.py embeds its web pages (HTML / CSS / JavaScript) as strings; those lines cannot be wrapped
"dlus.py" = ["E501"]
